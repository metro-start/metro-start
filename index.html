<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="A modern new tab page for the web. Inspired by Zune.">
    <title>metro start</title>
    <link rel="stylesheet" href="css/main.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <div class="background" aria-hidden="true">
        <canvas class="background__layer background__layer--active"></canvas>
        <canvas class="background__layer"></canvas>
        <div class="background__shade"></div>
    </div>

    <main class="shell">
        <header class="intro">
            <h1>metro start</h1>
            <p class="info">A modern new tab page for the web.</p>
            <p class="info smaller">Inspired by Zune.</p>
            <p class="info smaller">
                <a href="https://chromewebstore.google.com/detail/metro-start/bbhdfpmfdplolnnkpdepnelcfdmikjfd">Get Metro Start Now.</a>
            </p>
            <p class="info smaller">
                <button class="clickable" id="pause_bg" type="button" aria-pressed="false">(pause background)</button>
            </p>
        </header>

        <section class="slideshow" aria-label="Metro Start screenshots">
            <div class="slideshow__track">
                <img class="banner" src="img/banner1.png" alt="metro start apps page.">
                <img class="banner" src="img/banner2.png" alt="metro start bookmarks page.">
                <img class="banner" src="img/banner3.png" alt="metro start theme editor.">
            </div>
        </section>
    </main>

    <a class="github-ribbon" href="https://github.com/metro-start/metro-start">Fork me on GitHub</a>
</body>
</html>
